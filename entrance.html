<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация и вход</title>
<link rel = "stylesheet" href = "styles.css">
</head>
<body>

    
    <div id="loginSection">
        <h2>Вход</h2>
        <form id="loginForm">
            <div>
                <label for="loginUsername">Логин:</label><br>
                <input type="text" id="loginUsername" name="username" required>
            </div>
            
            <br>
            
            <div>
                <label for="loginPassword">Пароль:</label><br>
                <input type="password" id="loginPassword" name="password" required>
            </div>
            
            <br>
            
            <div>
                <button type="submit">Войти</button>
                <button type="button" onclick="showRegisterForm()">Регистрация</button>
            </div>
        </form>
        
        <br>
        <div id="loginMessage"></div>
    </div>
    
    <div id="registerSection" style="display:none">
        <h2>Регистрация нового пользователя</h2>
        <form id="registerForm">
            <div>
                <label for="regUsername">Логин:</label><br>
                <input type="text" id="regUsername" name="username" required>
            </div>
            
            <br>
            
            <div>
                <label for="regPassword">Пароль:</label><br>
                <input type="password" id="regPassword" name="password" required>
            </div>
            
            <br>
            
            <div>
                <label for="regEmail">Email:</label><br>
                <input type="email" id="regEmail" name="email" required>
            </div>
            
            <br>
            <div>
                <label for="rememberMe">
                    <input type="checkbox" id="rememberMe" name="rememberMe">
                    Запомнить меня на этом компьютере
                </label>
            </div>
            
            <br>
            
            <div>
                <button type="submit">Зарегистрироваться</button>
                <button type="button" onclick="showLoginForm()">Назад ко входу</button>
            </div>
        </form>
        
        <br>
        <div id="registerMessage"></div>
    </div>
    
    <div id="userProfile" style="display:none">
        <h2>Личный кабинет</h2>
        <p>Добро пожаловать, <span id="welcomeUsername"></span>!</p>
        <p>Email: <span id="userEmail"></span></p>
        <p>Дата регистрации: <span id="regDate"></span></p>
        
        <br>
        <button onclick="logout()">Выйти</button>
        <button onclick="deleteAccount()">Удалить аккаунт</button>
    </div>

    <script>
    
        const USERS_KEY = 'userDatabase';
        const CURRENT_USER_KEY = 'currentUser';
        
        function initUserDatabase() {
            if (!localStorage.getItem(USERS_KEY)) {
                localStorage.setItem(USERS_KEY, JSON.stringify([]));
            }
        }

        function checkExistingSession() {
            const currentUser = localStorage.getItem(CURRENT_USER_KEY);
            if (currentUser) {
                showUserProfile(JSON.parse(currentUser));
            }
        }

        function showRegisterForm() {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('registerSection').style.display = 'block';
            document.getElementById('userProfile').style.display = 'none';
        }
        
        function showLoginForm() {
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('registerSection').style.display = 'none';
            document.getElementById('userProfile').style.display = 'none';
        }

        function showUserProfile(user) {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('registerSection').style.display = 'none';
            document.getElementById('userProfile').style.display = 'block';
            
            document.getElementById('welcomeUsername').textContent = user.username;
            document.getElementById('userEmail').textContent = user.email || 'Не указан';
            document.getElementById('regDate').textContent = new Date(user.registrationDate).toLocaleDateString();
            
            displayStoredData();
        }

        document.getElementById('registerForm').addEventListener('submit', function(event) {
            event.preventDefault();
            
            const username = document.getElementById('regUsername').value;
            const password = document.getElementById('regPassword').value;
            const email = document.getElementById('regEmail').value;
            const rememberMe = document.getElementById('rememberMe').checked;

            if (!username || !password) {
                document.getElementById('registerMessage').innerHTML = '<p style="color:red">Логин и пароль обязательны!</p>';
                return;
            }
            
            const users = JSON.parse(localStorage.getItem(USERS_KEY));
            
            const existingUser = users.find(u => u.username === username);
            if (existingUser) {
                document.getElementById('registerMessage').innerHTML = '<p style="color:red">Пользователь с таким логином уже существует!</p>';
                return;
            }
            const newUser = {
                username: username,
                password: password, 
                email: email,
                registrationDate: new Date().toISOString()
            };
            
            users.push(newUser);
            localStorage.setItem(USERS_KEY, JSON.stringify(users));
            
            if (rememberMe) {
                localStorage.setItem(CURRENT_USER_KEY, JSON.stringify(newUser));
            } else {
                sessionStorage.setItem(CURRENT_USER_KEY, JSON.stringify(newUser));
            }

            showUserProfile(newUser);
            
            document.getElementById('registerMessage').innerHTML = '<p style="color:green">Регистрация успешна!</p>';
            document.getElementById('registerForm').reset();
        });

        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();
            
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            //тут проверка ещё имейла должна быть по хорошему

            const users = JSON.parse(localStorage.getItem(USERS_KEY));

            const user = users.find(u => u.username === username && u.password === password);
            
            if (user) {

                localStorage.setItem(CURRENT_USER_KEY, JSON.stringify(user));

                showUserProfile(user);
                
                document.getElementById('loginMessage').innerHTML = '<p style="color:green">Вход выполнен успешно!</p>';
                document.getElementById('loginForm').reset();
            } else {
                document.getElementById('loginMessage').innerHTML = '<p style="color:red">Неверный логин или пароль!</p>';
            }
        });

        function logout() {
            localStorage.removeItem(CURRENT_USER_KEY);
            sessionStorage.removeItem(CURRENT_USER_KEY);
            showLoginForm();
            displayStoredData();
        }

        function deleteAccount() {
            if (confirm('Вы уверены, что хотите удалить свой аккаунт? Это действие нельзя отменить.')) {
                const currentUser = JSON.parse(localStorage.getItem(CURRENT_USER_KEY));
                let users = JSON.parse(localStorage.getItem(USERS_KEY));

                users = users.filter(u => u.username !== currentUser.username);
                localStorage.setItem(USERS_KEY, JSON.stringify(users));
                

                logout();
                
                alert('Аккаунт успешно удален.');
            }
        }
        
        window.onload = function() {
            initUserDatabase();
            checkExistingSession();
        };
    </script>
</body>
</html>
